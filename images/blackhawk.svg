<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-label="Blackhawk AI — Retrieval-Augmented Generation system">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0d12"/>
      <stop offset="0.6" stop-color="#16080d"/>
      <stop offset="1" stop-color="#1f0a12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#ff004f" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff004f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#glow)"/>

  <!-- vector-embedding network -->
  <g stroke="#ff004f" stroke-opacity="0.45" stroke-width="1.5" fill="none">
    <path d="M150 220 L400 340 L650 190"/>
    <path d="M150 220 L260 520 L400 340"/>
    <path d="M650 190 L560 470 L400 340"/>
    <path d="M260 520 L400 700 L560 470"/>
    <path d="M120 640 L260 520"/>
    <path d="M680 660 L560 470"/>
    <path d="M120 640 L400 700 L680 660"/>
  </g>
  <g fill="#ff004f">
    <circle cx="150" cy="220" r="7" fill-opacity="0.9"/>
    <circle cx="650" cy="190" r="6" fill-opacity="0.8"/>
    <circle cx="400" cy="340" r="10"/>
    <circle cx="260" cy="520" r="7" fill-opacity="0.85"/>
    <circle cx="560" cy="470" r="8" fill-opacity="0.85"/>
    <circle cx="120" cy="640" r="5" fill-opacity="0.7"/>
    <circle cx="680" cy="660" r="6" fill-opacity="0.7"/>
    <circle cx="400" cy="700" r="8" fill-opacity="0.9"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.85">
    <circle cx="400" cy="340" r="4"/>
    <circle cx="400" cy="700" r="3"/>
    <circle cx="560" cy="470" r="3"/>
  </g>

  <!-- title -->
  <g font-family="'Times New Roman', Times, serif" text-anchor="middle">
    <text x="400" y="845" font-size="64" font-weight="700" fill="#ffffff" letter-spacing="2">Blackhawk AI</text>
    <text x="400" y="895" font-size="26" fill="#d4d4d4" letter-spacing="6">RETRIEVAL-AUGMENTED GENERATION</text>
  </g>
</svg>
